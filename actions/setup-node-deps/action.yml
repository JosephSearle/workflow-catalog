name: setup-node-deps
description: >-
  Detects pnpm or npm from the lockfile and Node from .nvmrc or .node-version, sets up both with
  dependency caching, then does a frozen install where the lockfile is.
author: JosephSearle

inputs:
  working-directory:
    description: >-
      Directory containing package.json, relative to the repo root. The lockfile may be here or in a
      parent workspace root (pnpm-workspace.yaml or npm "workspaces"); install runs where the lockfile is.
    required: false
    default: "."
  node-version:
    description: >-
      Node version spec, e.g. "22" or "lts/*". Empty reads .nvmrc or .node-version from
      working-directory, then the workspace root, then the repo root, then falls back to "lts/*".
    required: false
    default: ""

outputs:
  node-version:
    description: Node version that was set up, e.g. "v22.11.0".
    value: ${{ steps.node.outputs.version }}
  package-manager:
    description: Package manager detected from the lockfile, "pnpm" or "npm".
    value: ${{ steps.detect.outputs.package-manager }}
  lock-dir:
    description: Directory holding the lockfile, relative to the repo root ("." at the root). Install ran here.
    value: ${{ steps.detect.outputs.lock-dir }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: '"$GITHUB_ACTION_PATH/scripts/detect.sh"'

    # Reads the pnpm version from package.json's packageManager field.
    - name: Set up pnpm
      if: steps.detect.outputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ steps.detect.outputs.package-json }}

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.detect.outputs.node-version }}
        node-version-file: ${{ steps.detect.outputs.node-version-file }}
        cache: ${{ steps.detect.outputs.package-manager }}
        cache-dependency-path: ${{ steps.detect.outputs.lockfile }}

    - id: node
      name: Record Node version
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    # Install at the workspace root, where the lockfile is.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.detect.outputs.lock-dir }}
      env:
        PACKAGE_MANAGER: ${{ steps.detect.outputs.package-manager }}
      run: |
        if [ "$PACKAGE_MANAGER" = pnpm ]; then
          pnpm install --frozen-lockfile
        else
          npm ci
        fi
