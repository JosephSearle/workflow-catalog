name: Bug
description: A catalog workflow or action behaves incorrectly.
title: "fix: "
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: .github/workflows/node-ci.yml or actions/setup-node-cached
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Version or SHA used
      placeholder: v1.4.0
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Failing run URL
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
