# Internal. Tests .github/workflows/shell-lint.yml against fixtures.
# The failing fixtures run with fail-on-findings: false, so the calls succeed
# and the assert job checks their *-result outputs instead of a red job.
name: _test-wf-shell-lint

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Run shell-lint
    # Local ref: tests the version in this commit/PR.
    uses: ./.github/workflows/shell-lint.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/shell-lint

  # The install step has separate arm64 assets and hashes.
  run-arm:
    name: Run shell-lint (arm64)
    uses: ./.github/workflows/shell-lint.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/shell-lint
      runs-on: ubuntu-24.04-arm

  run-failing:
    name: Run shell-lint (shellcheck finding)
    uses: ./.github/workflows/shell-lint.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/shell-lint-failing
      fail-on-findings: false

  # The fixture's gitleaks config adds a rule matching its planted fake token,
  # so only this run finds it.
  run-secret:
    name: Run shell-lint (planted secret)
    uses: ./.github/workflows/shell-lint.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/shell-lint-secret
      gitleaks-config: tests/fixtures/shell-lint-secret/.gitleaks.toml
      fail-on-findings: false

  assert:
    name: Assert shell-lint outputs
    needs: [run, run-arm, run-failing, run-secret]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check outputs
        env:
          X64_FILES: ${{ needs.run.outputs.shellcheck-files }}
          X64_SHELLCHECK: ${{ needs.run.outputs.shellcheck-result }}
          X64_GITLEAKS: ${{ needs.run.outputs.gitleaks-result }}
          X64_PRE_COMMIT: ${{ needs.run.outputs.pre-commit-result }}
          ARM64_FILES: ${{ needs.run-arm.outputs.shellcheck-files }}
          ARM64_SHELLCHECK: ${{ needs.run-arm.outputs.shellcheck-result }}
          ARM64_GITLEAKS: ${{ needs.run-arm.outputs.gitleaks-result }}
          ARM64_PRE_COMMIT: ${{ needs.run-arm.outputs.pre-commit-result }}
          FAILING_FILES: ${{ needs.run-failing.outputs.shellcheck-files }}
          FAILING_SHELLCHECK: ${{ needs.run-failing.outputs.shellcheck-result }}
          FAILING_GITLEAKS: ${{ needs.run-failing.outputs.gitleaks-result }}
          SECRET_SHELLCHECK: ${{ needs.run-secret.outputs.shellcheck-result }}
          SECRET_GITLEAKS: ${{ needs.run-secret.outputs.gitleaks-result }}
        run: |
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$3', got '$2'."
              fail=1
            fi
          }

          for arch in X64 ARM64; do
            files="${arch}_FILES" shellcheck="${arch}_SHELLCHECK"
            gitleaks="${arch}_GITLEAKS" pre_commit="${arch}_PRE_COMMIT"
            # bin/deploy is found by its shebang, bin/report (python3) isn't.
            check "$arch shellcheck-files" "${!files}" "bin/deploy scripts/build.sh"
            check "$arch shellcheck-result" "${!shellcheck}" success
            check "$arch gitleaks-result" "${!gitleaks}" success
            # The fixture has a .pre-commit-config.yaml, so auto runs it.
            check "$arch pre-commit-result" "${!pre_commit}" success
          done

          # A shellcheck finding, with gitleaks still clean.
          check "failing shellcheck-files" "$FAILING_FILES" "run.sh"
          check "failing shellcheck-result" "$FAILING_SHELLCHECK" failure
          check "failing gitleaks-result" "$FAILING_GITLEAKS" success

          # gitleaks must report a finding ("failure"), not a config or run
          # error ("error"). The fixture has no scripts, so shellcheck skips.
          check "secret gitleaks-result" "$SECRET_GITLEAKS" failure
          check "secret shellcheck-result" "$SECRET_SHELLCHECK" skipped

          exit "$fail"
