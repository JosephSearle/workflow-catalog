# Public. Called by consumer repos. The file name is public API: renaming it is a breaking change.
# Docs: README.md#workflows   Example caller: examples/callers/shell-lint.yml
name: shell-lint

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory to lint, relative to the repo root. shellcheck checks the shell scripts under it, and
          pre-commit looks for .pre-commit-config.yaml in it. gitleaks always scans the whole repo history.
        type: string
        required: false
        default: "."
      pre-commit:
        description: >-
          Run `pre-commit run --all-files`: "auto" when working-directory has a .pre-commit-config.yaml,
          "true" to require one, "false" to skip. shellcheck and gitleaks are on PATH for local hooks.
        type: string
        required: false
        default: auto
      gitleaks-config:
        description: >-
          Path to a gitleaks config, relative to the repo root. Empty lets gitleaks use .gitleaks.toml
          at the repo root, or its default rules. .gitleaksignore at the repo root is always honoured.
        type: string
        required: false
        default: ""
      fail-on-findings:
        description: >-
          Fail the job when a check finds problems. false reports findings as warnings and in the
          *-result outputs without failing, e.g. while adopting gitleaks on a repo with old secrets.
          A check that can't run ("error") always fails the job.
        type: boolean
        required: false
        default: true
      runs-on:
        description: Runner label for the job. Linux x64 and arm64 runners are supported.
        type: string
        required: false
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        required: false
        default: 10
    outputs:
      shellcheck-files:
        description: Space-separated scripts shellcheck checked, relative to working-directory.
        value: ${{ jobs.lint.outputs.shellcheck-files }}
      shellcheck-result:
        description: >-
          shellcheck result: "success", "failure" (findings), "error" (shellcheck couldn't run) or
          "skipped" (no scripts found).
        value: ${{ jobs.lint.outputs.shellcheck-result }}
      gitleaks-result:
        description: >-
          gitleaks result: "success", "failure" (secrets found) or "error" (bad config or gitleaks
          couldn't run).
        value: ${{ jobs.lint.outputs.gitleaks-result }}
      pre-commit-result:
        description: pre-commit result, "success", "failure" or "skipped".
        value: ${{ jobs.lint.outputs.pre-commit-result }}

permissions: {}

jobs:
  lint:
    name: Shell lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      shellcheck-files: ${{ steps.shellcheck.outputs.files }}
      shellcheck-result: ${{ steps.report.outputs.shellcheck-result }}
      gitleaks-result: ${{ steps.report.outputs.gitleaks-result }}
      pre-commit-result: ${{ steps.report.outputs.pre-commit-result }}
    # The shellcheck and gitleaks pins live in actions/lint-shell and
    # actions/scan-secrets.
    env:
      PRE_COMMIT_VERSION: 4.7.0
      # pre-commit and its dependencies come from PyPI without hashes. This
      # cutoff keeps their resolution repeatable; move it with the version.
      PRE_COMMIT_EXCLUDE_NEWER: "2026-10-17T00:00:00Z"
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Full history, so gitleaks can scan every commit.
      - name: Check out caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        name: Check inputs and runner
        env:
          PRE_COMMIT: ${{ inputs.pre-commit }}
        run: |
          if [ "$RUNNER_OS" != Linux ]; then
            echo "::error::shell-lint runs on Linux runners only, got $RUNNER_OS. Set runs-on to a Linux label."
            exit 1
          fi
          case "$RUNNER_ARCH" in
            X64|ARM64) ;;
            *) echo "::error::shell-lint supports X64 and ARM64 runners, got $RUNNER_ARCH."; exit 1 ;;
          esac

          case "$PRE_COMMIT" in
            auto) if [ -f .pre-commit-config.yaml ]; then run=true; else run=false; fi ;;
            true)
              if [ ! -f .pre-commit-config.yaml ]; then
                echo "::error::pre-commit is 'true', but there's no .pre-commit-config.yaml in the working directory."
                exit 1
              fi
              run=true
              ;;
            false) run=false ;;
            *) echo "::error::pre-commit must be 'auto', 'true' or 'false', got '$PRE_COMMIT'."; exit 1 ;;
          esac
          echo "pre-commit=$run" >> "$GITHUB_OUTPUT"

      # Check out the catalog at the exact commit of this workflow so that
      # catalog actions always match the workflow's version.
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catalog
          sparse-checkout: /actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # .catalog must stay until the job ends, because catalog actions reload
      # it for post steps. Hide it from git, so pre-commit (which lists files
      # with git) skips it. lint-shell prunes it itself.
      - name: Exclude catalog checkout from git
        working-directory: .
        run: echo '/.catalog/' >> .git/info/exclude

      # Checks *.sh and *.bash files, plus any other file with a sh, bash, dash
      # or ksh shebang, and leaves shellcheck on PATH for pre-commit hooks.
      # Findings don't fail here: the report step decides, so the other
      # checks still run.
      - id: shellcheck
        name: Run shellcheck
        continue-on-error: true
        uses: ./.catalog/actions/lint-shell
        with:
          working-directory: ${{ inputs.working-directory }}
          fail-on-findings: "false"

      # Scans the whole Git history from the repo root, and leaves gitleaks on
      # PATH for pre-commit hooks. Findings don't fail here: the report step
      # decides, so the other checks still run.
      - id: gitleaks
        name: Run gitleaks
        continue-on-error: true
        uses: ./.catalog/actions/scan-secrets
        with:
          config: ${{ inputs.gitleaks-config }}
          fail-on-findings: "false"

      - name: Set up uv
        if: steps.detect.outputs.pre-commit == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # pre-commit runs from the repo root, so hook `files:` patterns are
      # root-relative.
      - id: pre-commit
        name: Run pre-commit
        if: steps.detect.outputs.pre-commit == 'true'
        continue-on-error: true
        working-directory: .
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          uvx --exclude-newer "$PRE_COMMIT_EXCLUDE_NEWER" "pre-commit@$PRE_COMMIT_VERSION" run --all-files --show-diff-on-failure \
            --config "${WORKING_DIRECTORY%/}/.pre-commit-config.yaml"

      - id: report
        name: Report results
        env:
          SHELLCHECK_RESULT: ${{ steps.shellcheck.outputs.result }}
          SHELLCHECK_FILES: ${{ steps.shellcheck.outputs.files }}
          SHELLCHECK_VERSION: ${{ steps.shellcheck.outputs.shellcheck-version }}
          GITLEAKS_RESULT: ${{ steps.gitleaks.outputs.result }}
          GITLEAKS_VERSION: ${{ steps.gitleaks.outputs.gitleaks-version }}
          PRE_COMMIT_OUTCOME: ${{ steps.pre-commit.outcome }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          # lint-shell and scan-secrets always set result. Treat a missing one
          # as an error.
          shellcheck_result="${SHELLCHECK_RESULT:-error}"
          gitleaks_result="${GITLEAKS_RESULT:-error}"
          read -ra shellcheck_files <<< "$SHELLCHECK_FILES"
          shellcheck_count="${#shellcheck_files[@]}"
          {
            echo "shellcheck-result=$shellcheck_result"
            echo "gitleaks-result=$gitleaks_result"
            echo "pre-commit-result=$PRE_COMMIT_OUTCOME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### shell-lint"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| shellcheck (${SHELLCHECK_VERSION:-?}, $shellcheck_count files) | $shellcheck_result |"
            echo "| gitleaks (v${GITLEAKS_VERSION:-?}, full history) | $gitleaks_result |"
            echo "| pre-commit | $PRE_COMMIT_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Errors always fail. Findings fail unless fail-on-findings is false.
          errored="" found=""
          for check in "shellcheck:$shellcheck_result" "gitleaks:$gitleaks_result" "pre-commit:$PRE_COMMIT_OUTCOME"; do
            case "${check#*:}" in
              error) errored="$errored ${check%%:*}" ;;
              failure) found="$found ${check%%:*}" ;;
            esac
          done
          if [ -n "$errored" ]; then
            echo "::error::Couldn't run:$errored. See the step logs above."
            exit 1
          fi
          if [ -n "$found" ]; then
            if [ "$FAIL_ON_FINDINGS" = true ]; then
              echo "::error::Found problems:$found. See the step logs above."
              exit 1
            fi
            echo "::warning::Found problems:$found. Not failing because fail-on-findings is false."
          fi
