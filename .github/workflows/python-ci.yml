# Public. Called by consumer repos. The file name is public API: renaming it is a breaking change.
# Docs: README.md#workflows   Example caller: examples/callers/python-ci.yml
name: python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing pyproject.toml, relative to the repo root. uv.lock may be here or in a
          parent directory (uv workspaces). In a workspace member, only that member's dependency groups
          are installed, so put dev tools in the member's dev group.
        type: string
        required: false
        default: "."
      python-version:
        description: >-
          Python version request, e.g. "3.12". Empty lets uv resolve it: .python-version, then
          requires-python in pyproject.toml.
        type: string
        required: false
        default: ""
      commands:
        description: >-
          Commands to run in order with `uv run`, one per line. Each line is split on whitespace,
          so shell syntax isn't supported. Commands whose tool isn't installed in the project
          environment are skipped with a notice.
        type: string
        required: false
        default: |
          ruff check
          ruff format --check
          pyright
          pytest
      runs-on:
        description: Runner label for the job.
        type: string
        required: false
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        required: false
        default: 15
    outputs:
      python-version:
        description: Python version that ran, e.g. "3.12.7".
        value: ${{ jobs.ci.outputs.python-version }}
      commands-run:
        description: Commands that ran, one per line, in order.
        value: ${{ jobs.ci.outputs.commands-run }}

permissions: {}

jobs:
  ci:
    name: Python CI
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      python-version: ${{ steps.setup.outputs.python-version }}
      commands-run: ${{ steps.run.outputs.commands-run }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check out the catalog at the exact commit of this workflow so that
      # catalog actions always match the workflow's version.
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catalog
          sparse-checkout: /actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: setup
        name: Set up uv and install dependencies
        uses: ./.catalog/actions/setup-python-deps
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}

      # .catalog must stay until the job ends: the action's post steps (cache
      # save) reload it from there. Hide it from git and gitignore-aware tools.
      - name: Exclude catalog checkout from git
        working-directory: .
        run: echo '/.catalog/' >> .git/info/exclude

      - id: run
        name: Run commands
        env:
          COMMANDS: ${{ inputs.commands }}
          PYTHON_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          # Only run tools installed in the project environment, not ones that
          # happen to be on the runner's PATH.
          scripts="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          ran=()
          while IFS= read -r line; do
            read -ra args <<< "$line"
            [ "${#args[@]}" -eq 0 ] && continue
            if [ ! -x "$scripts/${args[0]}" ]; then
              echo "::notice::Skipping '${args[*]}': ${args[0]} isn't installed in the project environment."
              continue
            fi
            echo "::group::uv run ${args[*]}"
            uv run --no-sync -- "${args[@]}"
            echo "::endgroup::"
            ran+=("${args[*]}")
          done <<< "$COMMANDS"

          if [ "${#ran[@]}" -eq 0 ]; then
            echo "::warning::None of the commands' tools are installed in the project environment, so only the install ran."
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "commands-run<<$delimiter"
            if [ "${#ran[@]}" -gt 0 ]; then printf '%s\n' "${ran[@]}"; fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

          summary="none"
          if [ "${#ran[@]}" -gt 0 ]; then
            summary="$(printf '%s<br>' "${ran[@]}")"
          fi
          {
            echo "### python-ci"
            echo
            echo "| Python | uv | Commands run |"
            echo "| --- | --- | --- |"
            echo "| $PYTHON_VERSION | $(uv --version | cut -d' ' -f2) | ${summary%<br>} |"
          } >> "$GITHUB_STEP_SUMMARY"
