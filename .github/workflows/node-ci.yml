# Public. Called by consumer repos. The file name is public API: renaming it is a breaking change.
# Docs: README.md#workflows   Example caller: examples/callers/node-ci.yml
name: node-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing package.json, relative to the repo root. The lockfile may be here or in a
          parent workspace root (pnpm-workspace.yaml or npm "workspaces"); install runs where the lockfile is.
        type: string
        required: false
        default: "."
      node-version:
        description: >-
          Node version spec, e.g. "22" or "lts/*". Empty reads .nvmrc or .node-version from
          working-directory, then the workspace root, then the repo root, then falls back to "lts/*".
        type: string
        required: false
        default: ""
      scripts:
        description: Space-separated package.json scripts to run in order. Scripts the package doesn't define are skipped with a notice.
        type: string
        required: false
        default: "lint typecheck test build"
      runs-on:
        description: Runner label for the job.
        type: string
        required: false
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        required: false
        default: 15
    outputs:
      node-version:
        description: Node version that ran, e.g. "v22.11.0".
        value: ${{ jobs.ci.outputs.node-version }}
      package-manager:
        description: Package manager detected from the lockfile, "pnpm" or "npm".
        value: ${{ jobs.ci.outputs.package-manager }}
      scripts-run:
        description: Space-separated scripts that ran, in order.
        value: ${{ jobs.ci.outputs.scripts-run }}

permissions: {}

jobs:
  ci:
    name: Node CI
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.setup.outputs.node-version }}
      package-manager: ${{ steps.setup.outputs.package-manager }}
      scripts-run: ${{ steps.run.outputs.scripts-run }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check out the catalog at the exact commit of this workflow so that
      # catalog actions always match the workflow's version.
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catalog
          sparse-checkout: /actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: setup
        name: Set up Node and install dependencies
        uses: ./.catalog/actions/setup-node-deps
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      # .catalog must stay until the job ends: the action's post steps (cache
      # save) reload it from there. Hide it from git and gitignore-aware tools.
      - name: Exclude catalog checkout from git
        working-directory: .
        run: echo '/.catalog/' >> .git/info/exclude

      - id: run
        name: Run scripts
        env:
          PACKAGE_MANAGER: ${{ steps.setup.outputs.package-manager }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          # Split SCRIPTS on whitespace without glob expansion.
          set -f
          ran=""
          for script in $SCRIPTS; do
            # Exit 2 means "not defined". Any other failure is a real error.
            status=0
            node -e '
              const scripts = require("./package.json").scripts || {};
              process.exit(Object.prototype.hasOwnProperty.call(scripts, process.argv[1]) ? 0 : 2);
            ' "$script" || status=$?
            case "$status" in
              0)
                echo "::group::$PACKAGE_MANAGER run $script"
                "$PACKAGE_MANAGER" run "$script"
                echo "::endgroup::"
                ran="${ran:+$ran }$script"
                ;;
              2) echo "::notice::Skipping '$script': it isn't defined in package.json scripts." ;;
              *) echo "::error::Couldn't read scripts from package.json (exit $status)."; exit "$status" ;;
            esac
          done

          if [ -z "$ran" ]; then
            echo "::warning::None of the scripts '$SCRIPTS' are defined in package.json, so only the install ran."
          fi
          echo "scripts-run=$ran" >> "$GITHUB_OUTPUT"
          {
            echo "### node-ci"
            echo
            echo "| Package manager | Node | Scripts run |"
            echo "| --- | --- | --- |"
            echo "| $PACKAGE_MANAGER | $(node --version) | ${ran:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
