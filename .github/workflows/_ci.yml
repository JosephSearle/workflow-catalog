# Internal. Runs on every PR. `ci-ok` is a required status check, alongside
# `PR title` from _pr-title.yml.
#
# To register a new component:
#   0. First component only: uncomment the `changes` job and add it to `ci-ok.needs`.
#   1. Add a filter under `changes.steps.filter.with.filters`.
#   2. Expose it under `changes.outputs`.
#   3. Add a job that calls its `_test-*.yml` when the filter matched.
#   4. Add that job to `ci-ok.needs`.
name: _ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Uncomment with the first component, and add `changes` to `ci-ok.needs`.
  # changes:
  #   name: Detect changes
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 5
  #   permissions:
  #     contents: read
  #     pull-requests: read
  #   outputs:
  #     action-<name>: ${{ steps.filter.outputs.action-<name> }}
  #     wf-<name>: ${{ steps.filter.outputs.wf-<name> }}
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #
  #     - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
  #       id: filter
  #       with:
  #         # Each test filter includes its own test workflow and fixtures.
  #         filters: |
  #           action-<name>:
  #             - 'actions/<name>/**'
  #             - '.github/workflows/_test-action-<name>.yml'
  #           wf-<name>:
  #             - '.github/workflows/<name>.yml'
  #             - '.github/workflows/_test-wf-<name>.yml'
  #             - 'tests/fixtures/<name>/**'
  #             - 'tests/fixtures/<name>-failing/**'

  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml
    permissions:
      contents: read

  # Push to main only: uploads zizmor findings to code scanning for the
  # dashboard. PRs and the merge queue are gated by _lint.yml's zizmor job,
  # so this isn't in `ci-ok.needs`. Kept here so only this job gets
  # `security-events: write`.
  zizmor-sarif:
    name: Security audit upload (zizmor)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: true

  # test-action-<name>:
  #   name: Test action <name>
  #   needs: changes
  #   if: needs.changes.outputs.action-<name> == 'true'
  #   uses: ./.github/workflows/_test-action-<name>.yml
  #   permissions:
  #     contents: read

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'. Check the jobs above."; exit 1 ;;
            esac
          done
