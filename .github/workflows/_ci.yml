# Internal. Runs on every PR. `ci-ok` is a required status check, alongside
# `PR title` from _pr-title.yml.
#
# To register a new component:
#   1. Add a filter under `changes.steps.filter.with.filters`.
#   2. Expose it under `changes.outputs`.
#   3. Add a job that calls its `_test-*.yml` when the filter matched.
#   4. Add that job to `ci-ok.needs`.
#   For a workflow's failing fixture, add `test-wf-<name>-failing` and
#   `test-wf-<name>-failing-assert`, and put only the assert job in `ci-ok.needs`.
#   Skip both on push (`github.event_name != 'push'`), so main stays green.
name: _ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action-setup-node-deps: ${{ steps.filter.outputs.action-setup-node-deps }}
      action-setup-python-deps: ${{ steps.filter.outputs.action-setup-python-deps }}
      action-scan-secrets: ${{ steps.filter.outputs.action-scan-secrets }}
      action-lint-shell: ${{ steps.filter.outputs.action-lint-shell }}
      wf-node-ci: ${{ steps.filter.outputs.wf-node-ci }}
      wf-python-ci: ${{ steps.filter.outputs.wf-python-ci }}
      wf-shell-lint: ${{ steps.filter.outputs.wf-shell-lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Each test filter includes its own test workflow and fixtures.
          filters: |
            # Reuses the node-ci fixtures.
            action-setup-node-deps:
              - 'actions/setup-node-deps/**'
              - '.github/workflows/_test-action-setup-node-deps.yml'
              - 'tests/fixtures/node-ci/**'
              - 'tests/fixtures/node-ci-npm/**'
              - 'tests/fixtures/node-ci-workspace/**'
              - 'tests/fixtures/node-ci-npm-workspace/**'
              - 'tests/fixtures/setup-node-deps-failing/**'
            # Reuses the python-ci fixtures.
            action-setup-python-deps:
              - 'actions/setup-python-deps/**'
              - '.github/workflows/_test-action-setup-python-deps.yml'
              - 'tests/fixtures/python-ci/**'
              - 'tests/fixtures/python-ci-bare/**'
              - 'tests/fixtures/python-ci-workspace/**'
              - 'tests/fixtures/setup-python-deps-failing/**'
            # Reuses the shell-lint-secret fixture.
            action-scan-secrets:
              - 'actions/scan-secrets/**'
              - '.github/workflows/_test-action-scan-secrets.yml'
              - 'tests/fixtures/shell-lint-secret/**'
            # Reuses the shell-lint fixtures.
            action-lint-shell:
              - 'actions/lint-shell/**'
              - '.github/workflows/_test-action-lint-shell.yml'
              - 'tests/fixtures/shell-lint/**'
              - 'tests/fixtures/shell-lint-failing/**'
              - 'tests/fixtures/shell-lint-secret/**'
            wf-node-ci:
              - '.github/workflows/node-ci.yml'
              - 'actions/setup-node-deps/**'
              - '.github/workflows/_test-wf-node-ci.yml'
              - 'tests/fixtures/node-ci/**'
              - 'tests/fixtures/node-ci-npm/**'
              - 'tests/fixtures/node-ci-workspace/**'
              - 'tests/fixtures/node-ci-npm-workspace/**'
              - 'tests/fixtures/node-ci-failing/**'
            wf-python-ci:
              - '.github/workflows/python-ci.yml'
              - 'actions/setup-python-deps/**'
              - '.github/workflows/_test-wf-python-ci.yml'
              - 'tests/fixtures/python-ci/**'
              - 'tests/fixtures/python-ci-bare/**'
              - 'tests/fixtures/python-ci-workspace/**'
              - 'tests/fixtures/python-ci-failing/**'
            wf-shell-lint:
              - '.github/workflows/shell-lint.yml'
              - 'actions/lint-shell/**'
              - 'actions/scan-secrets/**'
              - '.github/workflows/_test-wf-shell-lint.yml'
              - 'tests/fixtures/shell-lint/**'
              - 'tests/fixtures/shell-lint-failing/**'
              - 'tests/fixtures/shell-lint-secret/**'

  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml
    permissions:
      contents: read

  # Push to main only: uploads zizmor findings to code scanning for the
  # dashboard. PRs and the merge queue are gated by _lint.yml's zizmor job,
  # so this isn't in `ci-ok.needs`. Kept here so only this job gets
  # `security-events: write`.
  zizmor-sarif:
    name: Security audit upload (zizmor)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: true

  test-action-setup-node-deps:
    name: Test action setup-node-deps
    needs: changes
    if: needs.changes.outputs.action-setup-node-deps == 'true'
    uses: ./.github/workflows/_test-action-setup-node-deps.yml
    permissions:
      contents: read

  test-action-setup-python-deps:
    name: Test action setup-python-deps
    needs: changes
    if: needs.changes.outputs.action-setup-python-deps == 'true'
    uses: ./.github/workflows/_test-action-setup-python-deps.yml
    permissions:
      contents: read

  test-action-scan-secrets:
    name: Test action scan-secrets
    needs: changes
    if: needs.changes.outputs.action-scan-secrets == 'true'
    uses: ./.github/workflows/_test-action-scan-secrets.yml
    permissions:
      contents: read

  test-action-lint-shell:
    name: Test action lint-shell
    needs: changes
    if: needs.changes.outputs.action-lint-shell == 'true'
    uses: ./.github/workflows/_test-action-lint-shell.yml
    permissions:
      contents: read

  test-wf-node-ci:
    name: Test workflow node-ci
    needs: changes
    if: needs.changes.outputs.wf-node-ci == 'true'
    uses: ./.github/workflows/_test-wf-node-ci.yml
    permissions:
      contents: read

  # Failure path: this run is expected to fail, so it stays out of
  # `ci-ok.needs` and the assert job below checks its result instead.
  # Skipped on push to main, where the PR already ran it, so the red job
  # doesn't mark main's run as failed.
  test-wf-node-ci-failing:
    name: Test workflow node-ci (failing fixture, expected to fail)
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.wf-node-ci == 'true'
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/node-ci-failing

  test-wf-node-ci-failing-assert:
    name: Assert node-ci fails on failing fixture
    needs: [changes, test-wf-node-ci-failing]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.wf-node-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.test-wf-node-ci-failing.result }}
          PACKAGE_MANAGER: ${{ needs.test-wf-node-ci-failing.outputs.package-manager }}
          NODE_VERSION: ${{ needs.test-wf-node-ci-failing.outputs.node-version }}
        run: |
          if [ "$RESULT" != failure ]; then
            echo "::error::Expected node-ci to fail on tests/fixtures/node-ci-failing, got '$RESULT'."
            exit 1
          fi
          # Setup outputs prove it got past Node and package-manager setup.
          if [ "$PACKAGE_MANAGER" != npm ] || [ -z "$NODE_VERSION" ]; then
            echo "::error::node-ci failed during setup (package-manager '$PACKAGE_MANAGER', node-version '$NODE_VERSION'). Check its setup steps."
            exit 1
          fi

  test-wf-python-ci:
    name: Test workflow python-ci
    needs: changes
    if: needs.changes.outputs.wf-python-ci == 'true'
    uses: ./.github/workflows/_test-wf-python-ci.yml
    permissions:
      contents: read

  # Failure path: this run is expected to fail, so it stays out of
  # `ci-ok.needs` and the assert job below checks its result instead.
  # Skipped on push to main, where the PR already ran it, so the red job
  # doesn't mark main's run as failed.
  test-wf-python-ci-failing:
    name: Test workflow python-ci (failing fixture, expected to fail)
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.wf-python-ci == 'true'
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-ci-failing

  test-wf-python-ci-failing-assert:
    name: Assert python-ci fails on failing fixture
    needs: [changes, test-wf-python-ci-failing]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.wf-python-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.test-wf-python-ci-failing.result }}
          PYTHON_VERSION: ${{ needs.test-wf-python-ci-failing.outputs.python-version }}
        run: |
          if [ "$RESULT" != failure ]; then
            echo "::error::Expected python-ci to fail on tests/fixtures/python-ci-failing, got '$RESULT'."
            exit 1
          fi
          # The Python version output proves it got past uv setup and install.
          if [ -z "$PYTHON_VERSION" ]; then
            echo "::error::python-ci failed during setup (no python-version output). Check its setup and install steps."
            exit 1
          fi

  test-wf-shell-lint:
    name: Test workflow shell-lint
    needs: changes
    if: needs.changes.outputs.wf-shell-lint == 'true'
    uses: ./.github/workflows/_test-wf-shell-lint.yml
    permissions:
      contents: read

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - lint
      - test-action-setup-node-deps
      - test-action-setup-python-deps
      - test-action-scan-secrets
      - test-action-lint-shell
      - test-wf-node-ci
      - test-wf-node-ci-failing-assert
      - test-wf-python-ci
      - test-wf-python-ci-failing-assert
      - test-wf-shell-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'. Check the jobs above."; exit 1 ;;
            esac
          done
