# Internal. Tests actions/scan-secrets against this repo's own history and
# the shell-lint-secret fixture, whose config adds a rule for its planted
# fake token.
name: _test-action-scan-secrets

on:
  workflow_call:

permissions: {}

jobs:
  clean:
    name: Test scan-secrets (clean, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Separate gitleaks assets and hashes per architecture.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: subject
        uses: ./actions/scan-secrets

      - name: Assert outputs and side effects
        shell: bash
        env:
          RESULT: ${{ steps.subject.outputs.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::result: expected 'success', got '$RESULT'."
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "::error::Expected gitleaks on PATH after the action."
            exit 1
          fi

  cases:
    name: Test scan-secrets (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        case: [findings-warn, findings-fail, missing-config, shallow]
        include:
          - case: findings-warn
            config: tests/fixtures/shell-lint-secret/.gitleaks.toml
            fail-on-findings: "false"
            fetch-depth: 0
            outcome: success
            result: failure
          - case: findings-fail
            config: tests/fixtures/shell-lint-secret/.gitleaks.toml
            fail-on-findings: "true"
            fetch-depth: 0
            outcome: failure
            result: failure
          - case: missing-config
            config: tests/fixtures/does-not-exist.toml
            fail-on-findings: "false"
            fetch-depth: 0
            outcome: failure
            result: error
          # A shallow checkout is an error even with fail-on-findings false.
          - case: shallow
            config: ""
            fail-on-findings: "false"
            fetch-depth: 1
            outcome: failure
            result: error
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
          persist-credentials: false

      - id: subject
        continue-on-error: true
        uses: ./actions/scan-secrets
        with:
          config: ${{ matrix.config }}
          fail-on-findings: ${{ matrix.fail-on-findings }}

      - name: Assert outcome and result
        shell: bash
        env:
          OUTCOME: ${{ steps.subject.outcome }}
          RESULT: ${{ steps.subject.outputs.result }}
          GITLEAKS_VERSION: ${{ steps.subject.outputs.gitleaks-version }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXPECTED_RESULT: ${{ matrix.result }}
          CASE: ${{ matrix.case }}
        run: |
          fail=0
          if [ "$OUTCOME" != "$EXPECTED_OUTCOME" ]; then
            echo "::error::$CASE outcome: expected '$EXPECTED_OUTCOME', got '$OUTCOME'."
            fail=1
          fi
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "::error::$CASE result: expected '$EXPECTED_RESULT', got '$RESULT'."
            fail=1
          fi
          # gitleaks installs before the repo and config checks, so later
          # steps (shell-lint's pre-commit hooks) have it even when the scan
          # can't run.
          if ! command -v gitleaks >/dev/null || [ -z "$GITLEAKS_VERSION" ]; then
            echo "::error::$CASE: expected gitleaks on PATH and gitleaks-version set, got version '$GITLEAKS_VERSION'."
            fail=1
          fi
          exit "$fail"
