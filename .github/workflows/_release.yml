# Internal. Opens/updates the release PR, tags releases, moves the floating major tag.
# Runs the public release-please.yml from this commit, so every push to main
# exercises its live path. App setup: docs/release-please.md.
name: _release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release
    # Skipped until the release app is configured. See docs/release-please.md.
    if: vars.RELEASE_APP_CLIENT_ID != ''
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: read
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      move-major-tag: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
